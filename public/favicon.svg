<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    HSIわかる？ のアイコン。

    VORわかる？ が「地上局・電波・位置関係」で外から見る航法を表すのに対し、
    こちらは「コックピットの計器と自機シンボル」で中から見る航法を表す。

    小さく表示しても違いが分かるよう、要素は4つだけに絞ってある。
    ・暗い円形の計器面
    ・中央の白い自機シンボル（動かないもの）
    ・斜めに横切る青いコース矢印（自分で選ぶもの）
    ・上の琥珀色の機首指標（Sky Apps のアクセント色）

    width / height は付けない。付けると書き出しのときに拡大されない。
  -->
  <circle cx="32" cy="32" r="31" fill="#16203a" />
  <circle cx="32" cy="32" r="27" fill="#202c4d" />

  <!-- 方位目盛り。上は機首指標があるので置かない。 -->
  <g stroke="#f2f4fa" stroke-width="2.8" stroke-linecap="round">
    <line x1="58" y1="32" x2="51" y2="32" />
    <line x1="32" y1="58" x2="32" y2="51" />
    <line x1="6" y1="32" x2="13" y2="32" />
  </g>
  <g stroke="#aeb8d2" stroke-width="1.8" stroke-linecap="round">
    <line x1="50.4" y1="13.6" x2="46.8" y2="17.2" />
    <line x1="50.4" y1="50.4" x2="46.8" y2="46.8" />
    <line x1="13.6" y1="50.4" x2="17.2" y2="46.8" />
    <line x1="13.6" y1="13.6" x2="17.2" y2="17.2" />
  </g>

  <!-- 選んだコース。機首とは別に自分で決めるもの。 -->
  <g transform="rotate(38 32 32)">
    <polygon points="32,7 26,17.5 38,17.5" fill="#3a9de0" />
    <line
      x1="32"
      y1="45"
      x2="32"
      y2="57"
      stroke="#3a9de0"
      stroke-width="4.4"
      stroke-linecap="round"
    />
  </g>

  <!-- 自機シンボル。いつも上を向いたまま動かない。 -->
  <g stroke="#ffffff" stroke-width="3.6" stroke-linecap="round">
    <line x1="32" y1="22" x2="32" y2="42" />
    <line x1="21" y1="31" x2="43" y2="31" />
    <line x1="27" y1="38.5" x2="37" y2="38.5" />
  </g>

  <!-- 機首指標。 -->
  <polygon points="32,1.5 27,11 37,11" fill="#e8a200" />
</svg>
